<!doctype html>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: white; display: grid; grid-template-columns: repeat(10, 180px); }
  figure { width: 180px; height: 180px; margin: 0; border: 1px solid #888; position: relative; overflow: hidden; }
  img { width: 100%; height: 100%; object-fit: contain; }
  b { position: absolute; left: 2px; top: 2px; color: white; background: #000; padding: 1px 4px; font: 16px sans-serif; }
</style>
<script>
  addEventListener('DOMContentLoaded', () => {
    for (let i = 1; i <= 302; i++) {
      const f = document.createElement('figure');
      f.innerHTML = `<img src="file:///tmp/meme_thumbs/${i}.jpg"><b>${i}</b>`;
      document.body.append(f);
    }
  });
</script>
